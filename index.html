<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Zymar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Redirección (respaldo si JavaScript está desactivado) -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbxg7tB6WyJyQCkWkigO-jE3pGUysVmLF6tR5WpWnSouXfXxvr53y0ZTx87zrUx_teTe/exec">
  <style>
    html, body { height: 100%; margin: 0; background: #0b0f1a; color: #eef1f8;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .box { max-width: 320px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #9aa4bd; font-size: 14px; margin: 0 0 22px; }
    .bar { width: 200px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); margin: 0 auto 22px; overflow: hidden; }
    .bar::after { content: ''; display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #7c5cff, #22d3ee); animation: l 1.1s infinite ease-in-out; }
    a { color: #fff; background: #7c5cff; padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; }
    @keyframes l { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div class="box">
    <h1>Zymar</h1>
    <p>Abriendo la plataforma…</p>
    <div class="bar"></div>
    <a id="go" href="https://script.google.com/macros/s/AKfycbxg7tB6WyJyQCkWkigO-jE3pGUysVmLF6tR5WpWnSouXfXxvr53y0ZTx87zrUx_teTe/exec">Entrar ahora</a>
  </div>
  <script>
    // Cambia esta URL si tu enlace de Apps Script cambia
    var URL_APP = 'https://script.google.com/macros/s/AKfycbxg7tB6WyJyQCkWkigO-jE3pGUysVmLF6tR5WpWnSouXfXxvr53y0ZTx87zrUx_teTe/exec';
    document.getElementById('go').href = URL_APP;
    window.location.replace(URL_APP);
  </script>
</body>
</html>
