<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZYMAR</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<style>
:root{--red:#e50914;--red-hover:#f40612;--bg:#000}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:20px;background:radial-gradient(ellipse at 50% 38%,#3a0609 0%,#14070a 45%,#050506 100%)}
.screen::before{content:"";position:absolute;left:50%;top:38%;width:min(520px,90vw);height:min(520px,90vw);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(229,9,20,.28) 0%,rgba(229,9,20,0) 65%);animation:glow 2.2s ease-in-out infinite;pointer-events:none}
.mark{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center;font-size:44px}
.mark::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(229,9,20,.18)}
.mark::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#e50914;border-right-color:#ff2a35;box-shadow:0 0 22px rgba(229,9,20,.55);animation:rot 1s linear infinite}
.mark span{animation:pulse 1.4s ease-in-out infinite}
h1{margin:0;font-size:clamp(30px,9vw,54px);font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:0 16px;color:#e50914;background:linear-gradient(100deg,#b20710 20%,#ff2a35 40%,#fff 50%,#ff2a35 60%,#b20710 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 1.8s linear infinite}
.sub{margin:-12px 0 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#cfcfd4}
.bar{width:min(220px,60vw);height:4px;border-radius:4px;background:rgba(229,9,20,.18);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#b20710,#e50914,#ff2a35);box-shadow:0 0 12px rgba(229,9,20,.8);animation:slide 1.1s ease-in-out infinite}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 34px;border-radius:999px;font-size:16px;font-weight:800;color:#fff;text-decoration:none;background:linear-gradient(135deg,#f6121d 0%,#e50914 55%,#b20710 100%);box-shadow:0 8px 22px rgba(229,9,20,.38);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(229,9,20,.5)}
.btn:active{transform:scale(.97)}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.1);opacity:1}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){h1,.bar i,.mark span,.mark::after,.screen::before{animation:none}}
</style>
</head>
<body>
<main class="screen">
  <div class="mark"><span>🎬</span></div>
  <h1>ZYMAR</h1>
  <p class="sub">Cargando tu contenido…</p>
  <div class="bar"><i></i></div>
  <a id="go" class="btn" href="https://script.google.com/macros/s/AKfycbxGuce0i-ORVRlGnrkbQUW7QrVO5u3Yk5hjI4WfDPLXCsaIPO86laTI8Ay58Giedsc0aQ/exec">▶ Entrar</a>
</main>
<script>
  var URL_DESTINO = document.getElementById('go').href;
  // Redirección automática (el botón queda como respaldo)
  setTimeout(function(){ window.location.replace(URL_DESTINO); }, 2500);
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbxGuce0i-ORVRlGnrkbQUW7QrVO5u3Yk5hjI4WfDPLXCsaIPO86laTI8Ay58Giedsc0aQ/exec"></noscript>
</body>
</html>
