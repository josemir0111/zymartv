<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Zymar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    html, body { height: 100%; margin: 0; background: #000000; color: #eef1f8; overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000000; }
    #splash { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: #000000; transition: opacity .4s, visibility .4s; }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash h1 { font-size: 26px; margin: 0; }
    .bar { width: 200px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar::after { content: ''; display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #e11d2e, #7f0d16); animation: l 1.1s infinite ease-in-out; }
    @keyframes l { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="splash"><h1>Zymar</h1><div class="bar"></div></div>

  <!-- Tu enlace de Apps Script, tal cual -->
  <iframe id="app" title="Zymar"
    src="https://script.google.com/macros/s/AKfycbxg7tB6WyJyQCkWkigO-jE3pGUysVmLF6tR5WpWnSouXfXxvr53y0ZTx87zrUx_teTe/exec"
    allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write; accelerometer; gyroscope"
    allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>

  <script>
    document.getElementById('app').addEventListener('load', function () {
      document.getElementById('splash').classList.add('hide');
    });
    setTimeout(function () { document.getElementById('splash').classList.add('hide'); }, 8000);
  </script>
</body>
</html>
