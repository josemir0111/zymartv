<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Zymar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <style>
    :root { --bg:#0b0b0e; --red:#e50914; --red-hover:#f40612; --red-soft:#ff5a67; --text:#fff; --muted:#b4b8c4; --safe-x:clamp(20px,5vw,72px); }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--bg); color:var(--text); overflow-x:hidden;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    a:focus-visible, button:focus-visible { outline:3px solid #fff; outline-offset:3px; box-shadow:0 0 0 3px var(--red); }
    #dots { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.18; }

    /* ===== Portada ===== */
    .hero { position:relative; min-height:100vh; min-height:100svh; display:flex; align-items:center; overflow:hidden;
      padding:max(40px,env(safe-area-inset-top)) var(--safe-x) 48px; }
    .bg { position:absolute; inset:0; z-index:0; background:#000 center / cover no-repeat; filter:blur(7px) saturate(.75) contrast(.95) brightness(.34); transform:scale(1.06);
      animation:drift 40s ease-in-out infinite alternate; }
    @keyframes drift { from { transform:scale(1.06); } to { transform:scale(1.12); } }
    .hero::before { content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
      background:radial-gradient(ellipse at 78% 35%,rgba(229,9,20,.14),transparent 60%),
                 linear-gradient(180deg,rgba(15,15,18,.55),rgba(15,15,18,.8) 70%,var(--bg) 100%); }
    .grid { position:relative; z-index:3; width:100%; max-width:1180px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); gap:40px; align-items:center; }
    .txt { text-align:center; padding:28px 22px 24px; border-radius:22px; background:rgba(12,12,16,.68); border:1px solid rgba(255,255,255,.1);
      -webkit-backdrop-filter:blur(14px) saturate(1.2); backdrop-filter:blur(14px) saturate(1.2); box-shadow:0 20px 50px rgba(0,0,0,.5);
      animation:rise .8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
    @keyframes blink { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.25; transform:scale(.7); } }
    h1 { margin:0 0 22px; font-size:clamp(52px,12vw,96px); font-weight:800; line-height:1; letter-spacing:-.035em; color:#fff; }
    .sub { margin:0 0 8px; font-size:13px; font-weight:600; color:var(--muted); }
    .url { display:block; width:100%; max-width:480px; margin:0 auto 14px; padding:12px 14px; border-radius:10px; text-align:left; border:1px solid rgba(255,255,255,.16);
      background:rgba(0,0,0,.5); color:#e8e8ea; font-size:12px; line-height:1.45; word-break:break-all; -webkit-user-select:all; user-select:all;
      font-family:ui-monospace,Menlo,Consolas,monospace; }
    .acts { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn { position:relative; overflow:hidden; border:0; border-radius:10px; padding:14px 28px; font-size:16px; font-weight:700; cursor:pointer; text-decoration:none; color:#fff;
      display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .15s, background .15s, box-shadow .15s; }
    .btn:active { transform:scale(.98); }
    .btn-play { background:#fff; color:#000; box-shadow:0 8px 24px rgba(0,0,0,.4); }
    .btn-play:hover { background:#ececec; transform:translateY(-2px); }
    .btn-info { background:rgba(109,109,110,.6); }
    .btn-info:hover { background:rgba(109,109,110,.85); transform:translateY(-1px); }
    .btn.copied { background:linear-gradient(135deg,#22c55e,#15803d); }
    #ok { min-height:18px; margin-top:10px; font-size:13px; color:#cfcfd4; }

    /* ===== Categorías del sistema (pósters) ===== */
    .stack { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; scroll-padding-left:var(--safe-x); scrollbar-width:none; -webkit-overflow-scrolling:touch;
      margin:0 calc(var(--safe-x) * -1); padding:6px var(--safe-x) 14px; animation:rise .8s .15s cubic-bezier(.2,.8,.2,1) both; }
    .stack::-webkit-scrollbar { display:none; }
    .poster { position:relative; flex:none; width:104px; aspect-ratio:2/3; border-radius:14px; overflow:hidden; scroll-snap-align:start; display:flex; flex-direction:column; justify-content:flex-end;
      padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,.14); box-shadow:0 14px 30px rgba(0,0,0,.5); transition:transform .3s ease; }
    .poster img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; opacity:0; transition:opacity .6s ease, transform .6s ease; }
    .poster.has-img img { opacity:1; }
    .poster:hover img { transform:scale(1.08); }
    .poster.has-img .e { display:none; }
    .poster::after { content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.85)); }
    .poster .e { position:absolute; top:36%; left:0; right:0; text-align:center; font-size:36px; transform:translateY(-50%); z-index:1; filter:drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
    .poster b { position:relative; z-index:2; font-size:12.5px; line-height:1.2; text-shadow:0 1px 6px rgba(0,0,0,.7); }
    .g1 { background:linear-gradient(160deg,#f59e0b,#2a1705); } .g2 { background:linear-gradient(160deg,#e50914,#2a0508); }
    .g3 { background:linear-gradient(160deg,#7c3aed,#12081f); } .g4 { background:linear-gradient(160deg,#0ea5e9,#06141f); }
    .g5 { background:linear-gradient(160deg,#10b981,#052a1d); } .g6 { background:linear-gradient(160deg,#1db954,#06210f); }

    /* ===== Pie de página ===== */
    .foot { position:relative; z-index:3; border-top:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.02); }
    .foot-in { max-width:1180px; margin:0 auto; padding:40px var(--safe-x) 30px; display:grid; gap:30px; justify-items:center; text-align:center; }
    .foot-brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:19px; letter-spacing:-.01em; }
    .mark { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-size:17px; font-weight:800;
      background:linear-gradient(135deg,var(--red),var(--red-hover)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
    .foot-col h2 { margin:0 0 12px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .social { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .social:empty { display:none; }
    .net { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; color:#e8e8ea; text-decoration:none;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); transition:background .2s, border-color .2s, transform .2s; }
    .net svg { flex:none; }
    .net:hover { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.35); transform:translateY(-2px); }
    .visitas { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .visitas[hidden] { display:none; }
    .badge { display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px; font-size:13px; color:#e8e8ea; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); }
    .badge i { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.2); animation:blink 1.8s ease-in-out infinite; }
    .badge b { font-weight:700; }
    .paises { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }
    .paises:empty { display:none; }
    .pais { display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 5px; border-radius:999px; font-size:11.5px; font-weight:600; color:#e8e8ea;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); }
    .pais img { display:block; width:18px; height:13px; border-radius:2px; object-fit:cover; }
    .foot-bar { border-top:1px solid rgba(255,255,255,.06); padding:16px var(--safe-x) calc(18px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:12px; color:var(--muted); }
    @media (min-width:760px) {
      .foot-in { grid-template-columns:1fr auto auto; justify-items:start; text-align:left; align-items:center; gap:56px; }
      .social { justify-content:flex-start; } .visitas { align-items:flex-start; } .paises { justify-content:flex-start; }
    }
    .ic { flex: none; }
    .ic-check { display: none; }
    .btn.copied .ic-copy { display: none; }
    .btn.copied .ic-check { display: block; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
    .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.45); pointer-events: none;
      transform: scale(0); animation: rip .65s ease-out forwards; }
    @keyframes rip { to { transform: scale(1); opacity: 0; } }

    @media (min-width:900px) {
      .grid { grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:56px; }
      .poster:nth-child(4) { display:flex; }
      .txt { text-align:left; padding:36px 36px 30px; } .url { margin-left:0; } .acts { justify-content:flex-start; }
      .stack { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; overflow:visible; max-width:380px; margin:0 auto; padding:0 0 4px; scroll-snap-type:none; }
      .poster { width:auto; }
      .poster:hover { transform:translateY(-6px); z-index:5; }
    }
    @keyframes float { 0%,100% { translate:0 0; } 50% { translate:0 -14px; } }
    @media (prefers-reduced-motion:reduce) { .bg, .btn::after, .promo::before, .badge i, .poster, .txt, .stack { animation:none; } }
  </style>
</head>
<body>
  <canvas id="dots" aria-hidden="true"></canvas>
  <main>
    <section class="hero">
      <div class="bg" aria-hidden="true"></div>
      <div class="grid">
        <div class="txt">
          <h1>Zymar</h1>
          <p class="sub">Copia el enlace y pégalo en tu navegador (mejor en incógnito)</p>
          <code class="url" id="url"></code>
          <div class="acts">
            <a class="btn btn-play" id="enter" href="#" target="_blank" rel="noopener noreferrer"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>Entrar</span></a>
            <button class="btn btn-info" id="copy" type="button"><svg class="ic ic-copy" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><svg class="ic ic-check" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="ctxt">Copiar enlace</span></button>
          </div>
          <div id="ok" role="status" aria-live="polite"></div>
        </div>
        <div class="stack" role="list" aria-label="Categorías">
          <div class="poster g1" role="listitem" data-img="radio"><span class="e">📻</span><b>Radio</b></div>
          <div class="poster g2" role="listitem" data-img="tv"><span class="e">📡</span><b>TV en vivo</b></div>
          <div class="poster g3" role="listitem" data-img="peliculas"><span class="e">🎬</span><b>Películas</b></div>
          <div class="poster g4" role="listitem" data-img="series"><span class="e">📺</span><b>Series</b></div>
          <div class="poster g5" role="listitem" data-img="documentales"><span class="e">🌍</span><b>Documentales</b></div>
          <div class="poster g6" role="listitem" data-img="musica"><span class="e">🎵</span><b>Música</b></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="foot">
    <div class="foot-in">
      <div class="foot-brand"><span class="mark">Z</span><span>Zymar</span></div>
      <div class="foot-col col-redes"><h2>Síguenos</h2><div class="social" id="social"></div></div>
      <div class="foot-col"><div class="visitas" id="visitas" hidden><span class="badge"><i></i><b id="vtotal">0</b>&nbsp;visitantes</span><div class="paises" id="paises"></div></div></div>
    </div>
    <div class="foot-bar">© <span id="yr"></span> Zymar</div>
  </footer>
  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    document.addEventListener('DOMContentLoaded', function () { if (!document.getElementById('social').children.length) document.querySelector('.col-redes').hidden = true; });
    // Imágenes de las tarjetas: cambia aquí cualquier URL por la tuya (JPG/PNG/WebP). Si una falla, se ve el degradado con ícono.
    // Fotos gratuitas de Unsplash (licencia Unsplash). Los parámetros w, h y fit=crop las recortan al tamaño de la tarjeta.
    var IMGS = {
      radio:        'https://images.unsplash.com/photo-1487180144351-b8472da7d491',
      tv:           'https://images.unsplash.com/photo-1760895223972-57b1d858d77e',
      peliculas:    'https://images.unsplash.com/photo-1738708387940-ff9b5f673c29',
      series:       'https://images.unsplash.com/photo-1539786723186-577e290c1bee',
      documentales: 'https://images.unsplash.com/photo-1781127445118-8140677fdea1',
      musica:       'https://images.unsplash.com/photo-1713281318667-920b4708e77e'
    };
    function fotoUrl(u) { return /unsplash[.]com/.test(u) && u.indexOf('?') < 0 ? u + '?auto=format&fit=crop&w=320&h=480&q=70' : u; }
    Array.prototype.forEach.call(document.querySelectorAll('.poster[data-img]'), function (p) {
      var u = IMGS[p.getAttribute('data-img')]; if (!u) return;
      var im = new Image(); im.alt = ''; im.decoding = 'async';
      im.onload = function () { p.insertBefore(im, p.firstChild); p.classList.add('has-img'); };
      im.onerror = function () {};
      im.src = fotoUrl(u);
    });
  </script>
  <script>
    // Para cambiar el enlace, edita solo esta línea.
    var URL_APP = 'https://script.google.com/macros/s/AKfycbxg7tB6WyJyQCkWkigO-jE3pGUysVmLF6tR5WpWnSouXfXxvr53y0ZTx87zrUx_teTe/exec';
    var $ = function (id) { return document.getElementById(id); };
    $('url').textContent = URL_APP;
    $('enter').href = URL_APP;
    var timer;
    function done(ok) {
      var b = $('copy');
      $('ctxt').textContent = ok ? '¡Enlace copiado!' : 'Mantén presionado el enlace para copiarlo';
      if (ok) b.classList.add('copied');
      clearTimeout(timer);
      timer = setTimeout(function () { $('ctxt').textContent = 'Copiar enlace'; b.classList.remove('copied'); }, 2500);
    }
    function fallback() {
      var t = document.createElement('textarea');
      t.value = URL_APP; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); t.setSelectionRange(0, 99999);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
      done(ok);
    }
    $('copy').addEventListener('click', function () {
      if (!URL_APP) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(URL_APP).then(function () { done(true); }, fallback);
      } else { fallback(); }
    });
    // Efecto de onda al tocar los botones
    function ripple(e) {
      var el = e.currentTarget, r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, o = document.createElement('span');
      o.className = 'ripple'; o.style.width = o.style.height = d + 'px';
      o.style.left = (e.clientX - r.left - d / 2) + 'px'; o.style.top = (e.clientY - r.top - d / 2) + 'px';
      el.appendChild(o); setTimeout(function () { o.remove(); }, 700);
    }
    $('copy').addEventListener('pointerdown', ripple);
    $('enter').addEventListener('pointerdown', ripple);

    // Redes sociales: pega tu enlace entre las comillas de cada red. Las que dejes vacías no se muestran.
    var ICONS = {
      Instagram: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
      TikTok: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2 4.2 5 4.5"/></svg>',
      YouTube: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/></svg>',
      Facebook: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg>'
    };
    var SOCIAL = [
      { n: 'Instagram', u: '' },
      { n: 'TikTok',    u: '' },
      { n: 'YouTube',   u: '' },
      { n: 'Facebook',  u: '' }
    ];
    SOCIAL.forEach(function (r) {
      if (!r.u) return;
      var a = document.createElement('a');
      a.className = 'net'; a.href = r.u; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.innerHTML = (ICONS[r.n] || '') + '<span></span>';
      a.lastChild.textContent = r.n;
      $('social').appendChild(a);
    });

    // Contador de visitantes ÚNICOS, todo dentro del index (sin servidor propio).
    // Usa el servicio gratuito Abacus (abacus.jasoncameron.dev): un contador general y uno por país.
    // Anti-duplicados: cada visitante deja dos "marcas" anónimas (una de su navegador y una de su IP, ambas cifradas).
    // Solo se suma si NINGUNA de las dos existía antes, así que entrar de nuevo, o hacerlo en incógnito, no vuelve a contar.
    // IMPORTANTE: cambia NS y SAL por textos únicos tuyos (letras, números y guiones; NS entre 3 y 64 caracteres).
    var CONTADOR = {
      api: 'https://abacus.jasoncameron.dev',
      ns: 'zymar-k7q2x9',
      sal: 'zymar-cambia-esta-frase',
      dedupIP: true,   // true = también evita duplicados por IP (cubre incógnito). false = solo por navegador
      // Países que se muestran con bandera (código ISO de 2 letras). Los demás igual suman al total.
      paises: ['PE','MX','CO','AR','CL','EC','BO','VE','UY','PY','CR','PA','ES','US','BR','DO']
    };
    (function () {
      var K_ID = 'zymar_vid', K_REG = 'zymar_vreg', K_CACHE = 'zymar_vcache', FRESCO = 5 * 60 * 1000;
      var API = CONTADOR.api + '/', NS = CONTADOR.ns + '/', PAISES = CONTADOR.paises;
      function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      var nombres = null;
      try { nombres = new Intl.DisplayNames(['es'], { type: 'region' }); } catch (e) {}

      // Dibuja el total y las banderas (con la cantidad de visitantes de cada país)
      function pintar(d) {
        if (!d || typeof d.total !== 'number') return;
        $('vtotal').textContent = d.total.toLocaleString('es');
        var cont = $('paises'); cont.textContent = '';
        (d.paises || []).forEach(function (p) {
          var cc = String(p.c || '').toLowerCase();
          if (!/^[a-z]{2}$/.test(cc)) return;
          var nom = ''; try { if (nombres) nom = nombres.of(cc.toUpperCase()); } catch (e) {}
          var s = document.createElement('span'); s.className = 'pais';
          s.title = (nom || cc.toUpperCase()) + ': ' + p.n;
          var img = document.createElement('img');
          img.src = 'https://flagcdn.com/w40/' + cc + '.png'; img.alt = nom || cc.toUpperCase();
          img.width = 18; img.height = 13; img.loading = 'lazy';
          img.onerror = function () { img.style.display = 'none'; };
          var n = document.createElement('span'); n.textContent = p.n;
          s.appendChild(img); s.appendChild(n); cont.appendChild(s);
        });
        $('visitas').hidden = false;
      }

      // Lee un contador: número (0 si aún no existe) o null si hubo un error real (sin conexión, límite, servidor)
      function leer(k) {
        return fetch(API + 'get/' + NS + k)
          .then(function (r) {
            if (r.ok) return r.json().then(function (d) { return Number(d.value) || 0; });
            return (r.status >= 400 && r.status < 500 && r.status !== 429) ? 0 : null;
          })
          .catch(function () { return null; });
      }
      // Suma 1 a un contador (lo crea si no existe) y devuelve su nuevo valor
      function sumar(k) {
        return fetch(API + 'hit/' + NS + k).then(function (r) {
          if (!r.ok) throw new Error('hit');
          return r.json();
        }).then(function (d) { return Number(d.value); });
      }
      // Total + los países con más visitantes (hasta 8). Si algo falla, no devuelve datos a medias.
      function resumen() {
        var pedidos = [leer('total')].concat(PAISES.map(function (c) { return leer('pais-' + c.toLowerCase()); }));
        return Promise.all(pedidos).then(function (v) {
          if (v.indexOf(null) !== -1) throw new Error('lectura incompleta');
          var lista = PAISES.map(function (c, i) { return { c: c, n: v[i + 1] }; })
            .filter(function (p) { return p.n > 0; })
            .sort(function (a, b) { return b.n - a.n; })
            .slice(0, 8);
          return { total: v[0], paises: lista };
        });
      }
      function guardar(d) { pintar(d); lsSet(K_CACHE, JSON.stringify({ t: Date.now(), d: d })); }

      // Huella anónima (hash): nunca se guarda la IP ni el identificador reales
      function cyrb53(s, seed) {
        var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed, i, c;
        for (i = 0; i < s.length; i++) { c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return 4294967296 * (2097151 & h2) + (h1 >>> 0);
      }
      function huella(txt) {
        var t = CONTADOR.sal + '|' + txt;
        if (window.crypto && crypto.subtle && window.TextEncoder) {
          return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function (buf) {
            return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('').slice(0, 32);
          }).catch(function () { return (cyrb53(t, 1).toString(16) + cyrb53(t, 2).toString(16)).slice(0, 32); });
        }
        return Promise.resolve((cyrb53(t, 1).toString(16) + cyrb53(t, 2).toString(16)).slice(0, 32));
      }

      // IP y país del visitante (si el primer servicio falla, prueba el segundo)
      function geo() {
        return fetch('https://api.country.is/').then(function (r) { return r.json(); })
          .catch(function () { return fetch('https://get.geojs.io/v1/ip/country.json').then(function (r) { return r.json(); }); })
          .then(function (g) { return { ip: String(g.ip || ''), cc: String(g.country || '').toUpperCase() }; })
          .catch(function () { return { ip: '', cc: '' }; });
      }

      // Identificador anónimo de este navegador
      var vid = lsGet(K_ID);
      if (!vid) {
        vid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
        lsSet(K_ID, vid);
      }

      // Deja las marcas del visitante. Cada "hit" devuelve cuántas veces se usó esa marca (1 = era nueva).
      // Es un visitante nuevo SOLO si todas sus marcas valen 1. Si alguna ya existía, es alguien que ya entró.
      function esNuevo(g) {
        var marcas = [huella('d|' + vid).then(function (h) { return sumar('d-' + h); })];
        if (CONTADOR.dedupIP && g.ip) marcas.push(huella('i|' + g.ip).then(function (h) { return sumar('v-' + h); }));
        return Promise.all(marcas).then(function (vals) {
          return vals.every(function (n) { return n === 1; });
        });
      }

      // Muestra al instante el último número guardado mientras llega el actualizado
      var cache = null;
      try { cache = JSON.parse(lsGet(K_CACHE)); } catch (e) {}
      if (cache && cache.d) pintar(cache.d);

      // Si este navegador ya fue revisado, solo actualiza el número (y no más de una vez cada 5 min)
      if (lsGet(K_REG)) {
        if (!cache || Date.now() - cache.t > FRESCO) resumen().then(guardar).catch(function () {});
        return;
      }
      // Primera vez en este navegador: comprueba si es un visitante nuevo y, solo entonces, suma al total y a su país
      geo().then(function (g) {
        return esNuevo(g).then(function (nuevo) {
          if (!nuevo) return;
          var sumas = [sumar('total')];
          if (g.cc && PAISES.indexOf(g.cc) >= 0) sumas.push(sumar('pais-' + g.cc.toLowerCase()).catch(function () {}));
          return Promise.all(sumas);
        });
      }).then(function () {
        lsSet(K_REG, '1');
        return resumen();
      }).then(guardar).catch(function () {});
    })();

    // Fondo de pantalla (Dropbox). Si el primer enlace falla, prueba el enlace directo.
    (function () {
      var base = 'https://www.dropbox.com/scl/fi/16lbymfscgsze7lbgp7nc/ChatGPT-Image-13-sept-2026-09_37_47-p.m..png?rlkey=cw8iog21icw665a1b0tjtv101&st=4fykjltk';
      var candidatos = [
        base + '&raw=1',
        base.replace('www.dropbox.com', 'dl.dropboxusercontent.com'),
        base + '&dl=1'
      ];
      var i = 0, bg = document.querySelector('.bg');
      function probar() {
        if (i >= candidatos.length) return;
        var u = candidatos[i++], img = new Image();
        img.onload = function () { bg.style.backgroundImage = 'url("' + u + '")'; };
        img.onerror = probar;
        img.src = u;
      }
      probar();
    })();

    // Puntos animados sobre el fondo (ligero: sin librerías, no usa ancho de banda extra)
    (function () {
      var c = document.getElementById('dots'), x = c.getContext('2d');
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W, H, P = [], LINK, mx = -9999, my = -9999, raf = 0, t = 0;

      function size() {
        W = window.innerWidth; H = window.innerHeight;
        c.width = W * dpr; c.height = H * dpr;
        c.style.width = W + 'px'; c.style.height = H + 'px';
        x.setTransform(dpr, 0, 0, dpr, 0, 0);
        LINK = W < 600 ? 90 : 130;
        var n = Math.min(110, Math.round(W * H / 15000));
        while (P.length < n) P.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
          r: .8 + Math.random() * 1.6, red: Math.random() < .18, ph: Math.random() * 6.28
        });
        P.length = n;
      }

      function frame() {
        t += .02;
        x.clearRect(0, 0, W, H);
        var i, j, a, b, dx, dy, d, al;
        for (i = 0; i < P.length; i++) {
          a = P[i];
          if (!reduce) {
            a.x += a.vx; a.y += a.vy;
            if (a.x < -10) a.x = W + 10; else if (a.x > W + 10) a.x = -10;
            if (a.y < -10) a.y = H + 10; else if (a.y > H + 10) a.y = -10;
          }
          for (j = i + 1; j < P.length; j++) {
            b = P[j]; dx = a.x - b.x; dy = a.y - b.y; d = Math.sqrt(dx * dx + dy * dy);
            if (d < LINK) {
              al = (1 - d / LINK) * .22;
              x.strokeStyle = 'rgba(255,255,255,' + al + ')';
              x.lineWidth = .7; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
            }
          }
          dx = a.x - mx; dy = a.y - my; d = Math.sqrt(dx * dx + dy * dy);
          if (d < LINK + 40) {
            al = (1 - d / (LINK + 40)) * .55;
            x.strokeStyle = 'rgba(255,90,103,' + al + ')';
            x.lineWidth = .9; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(mx, my); x.stroke();
          }
          al = .45 + .4 * Math.sin(t + a.ph);
          x.fillStyle = a.red ? 'rgba(255,90,103,' + al + ')' : 'rgba(255,255,255,' + al + ')';
          x.beginPath(); x.arc(a.x, a.y, a.r, 0, 6.2832); x.fill();
        }
        if (!reduce) raf = requestAnimationFrame(frame);
      }

      function start() { cancelAnimationFrame(raf); frame(); }
      size(); start();
      window.addEventListener('resize', function () { size(); if (reduce) frame(); });
      window.addEventListener('pointermove', function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });
      window.addEventListener('pointerleave', function () { mx = my = -9999; });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) cancelAnimationFrame(raf); else if (!reduce) start();
      });
    })();
  </script>
</body>
